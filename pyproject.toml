[project]
name = "lora-vs-ft"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "peft>=0.21.3",
    "pycocotools>=2.0.11",
    "scipy>=1.18.1",
    "timm>=1.0.31",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "transformers>=5.23.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cuda" }]
